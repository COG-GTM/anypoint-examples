# Server Configuration
server.port=8080

# Salesforce Configuration
salesforce.username=${SALESFORCE_USERNAME:alex@cognition.sandbox}
salesforce.password=${SALESFORCE_PASSWORD:}
salesforce.security-token=${SALESFORCE_SECURITY_TOKEN:}
salesforce.login-url=${SALESFORCE_LOGIN_URL:https://test.salesforce.com}

# File Polling Configuration
file.polling.input-directory=${INPUT_DIRECTORY:input}
file.polling.output-directory=${OUTPUT_DIRECTORY:output}
file.polling.interval-ms=${POLLING_INTERVAL_MS:10000}
file.polling.csv-pattern=*.csv

# Logging Configuration
logging.level.com.example.importleads=INFO
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
