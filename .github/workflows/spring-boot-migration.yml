name: spring-boot-migration

on:
  pull_request:
    paths:
      - 'spring-boot-migration/**'
      - '.github/workflows/spring-boot-migration.yml'
  push:
    paths:
      - 'spring-boot-migration/**'
      - '.github/workflows/spring-boot-migration.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-boot-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify (includes parity tests)
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-boot-migration/**/target/surefire-reports/
          if-no-files-found: ignore
