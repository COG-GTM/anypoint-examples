spring:
  application:
    name: import-contacts-into-salesforce
  main:
    web-application-type: none

# Mule file:inbound-endpoint path / moveToDirectory / pollingFrequency
file:
  input-path: src/main/resources/input
  output-path: src/main/resources/output
  polling-frequency: 10000

# Mule sfdc:config (username / password / securityToken keep their Mule keys, e.g. -Dsfdc.user=...).
# The REST API needs a Connected App: consumerKey / consumerSecret are new (see README "Behavioural deltas").
sfdc:
  user: ""
  password: ""
  securityToken: ""
  consumerKey: ""
  consumerSecret: ""
  login-url: https://login.salesforce.com
  api-version: "61.0"
