# Mule: http:listener-config port="${http.port}" (AdmissionService, PatientService, EHRService on the same listener)
server:
  port: ${http.port:8081}

# Mule: http:request-config host="0.0.0.0" port="${http.port}" - the Admission flow calls the Patient/EHR
# services over HTTP on its own listener. Blank = http://localhost:<actual server port>.
hospital:
  services:
    base-url: ""
