server:
  port: ${http.port:8081}

# Mule sap:connector (sap.jco.* in mule-app.properties) + the HTTP gateway that executes the BAPIs.
sap:
  gateway-base-url: ${SAP_GATEWAY_BASE_URL:http://${sap.jco.ashost}:8000/sap/bapi}
  jco:
    ashost: ${SAP_JCO_ASHOST:localhost}
    client: ${SAP_JCO_CLIENT:800}
    lang: ${SAP_JCO_LANG:EN}
    sysnr: ${SAP_JCO_SYSNR:00}
    user: ${SAP_JCO_USER:}
    passwd: ${SAP_JCO_PASSWD:}
